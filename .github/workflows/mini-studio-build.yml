name: Mini Studio – build Windows

# Tự đóng gói Mini Studio thành MiniStudio.exe (portable zip + bộ cài đặt) trên máy Windows của GitHub.
# Chạy tay ở tab Actions, hoặc đẩy tag dạng mini-studio-v1.1.0 để tạo bản phát hành (Release).
on:
  workflow_dispatch:
  push:
    tags: ["mini-studio-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mini-studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install -r requirements-tts.txt
        shell: pwsh

      - name: Đóng gói bằng PyInstaller
        run: pyinstaller packaging/ministudio.spec --noconfirm --clean
        shell: pwsh

      - name: Kiểm tra bản đóng gói khởi động được
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\MiniStudio\MiniStudio.exe -ArgumentList "--no-browser","--port","8899" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-RestMethod http://127.0.0.1:8899/api/system; if ($r.frozen) { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "MiniStudio.exe không khởi động được" }
          Write-Host "OK: MiniStudio $($r.version), ffmpeg: $($r.ffmpeg)"
          Remove-Item -Recurse -Force dist\MiniStudio\data -ErrorAction SilentlyContinue

      - name: Nén bản portable
        shell: pwsh
        run: |
          Copy-Item README.md dist\MiniStudio\HUONG-DAN.md
          Compress-Archive -Path dist\MiniStudio -DestinationPath dist\MiniStudio-portable.zip -Force

      - name: Tạo bộ cài đặt (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $ver = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".Replace("mini-studio-v", "") } else { "1.1.0" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" packaging\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: MiniStudio-windows
          path: |
            mini-studio/dist/MiniStudio-portable.zip
            mini-studio/dist/MiniStudio-Setup.exe

      - name: Tạo Release (khi đẩy tag)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mini-studio/dist/MiniStudio-portable.zip
            mini-studio/dist/MiniStudio-Setup.exe
