<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" role="img" aria-label="Minh hoạ bộ não tư duy">
  <defs>
    <linearGradient id="blob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9e5ff"/><stop offset="1" stop-color="#fbe7ff"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5dfc"/><stop offset="1" stop-color="#b14cf0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd166" stop-opacity=".9"/><stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#3b2a9e" flood-opacity=".25"/>
    </filter>
  </defs>
  <path d="M90 120C150 30 330 10 440 70s120 210 60 300-210 140-320 100S30 210 90 120z" fill="url(#blob)"/>
  <!-- grid dots -->
  <g fill="#c9c2ff">
