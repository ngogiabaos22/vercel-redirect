    <circle cx="470" cy="80" r="3"/><circle cx="490" cy="80" r="3"/><circle cx="510" cy="80" r="3"/>
    <circle cx="470" cy="100" r="3"/><circle cx="490" cy="100" r="3"/><circle cx="510" cy="100" r="3"/>
  </g>
  <!-- head profile -->
  <g filter="url(#sh)">
    <path d="M190 470V400C138 378 108 326 110 262 112 166 182 96 276 96c96 0 154 70 150 150l26 58c5 11 0 17-11 18l-15 2v34c0 22-16 35-38 33l-36-4v83z" fill="url(#head)"/>
  </g>
  <!-- brain network -->
  <circle cx="270" cy="220" r="110" fill="url(#glow)" opacity=".55"/>
  <g stroke="#fff" stroke-opacity=".75" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M180 230L230 170 300 150 360 190 380 250 330 300 260 310 200 290z"/>
    <path d="M230 170L260 235 300 150M260 235L360 190M260 235L330 300M260 235L200 290M260 235L180 230M260 235L380 250"/>
  </g>
  <g fill="#fff">
    <circle cx="180" cy="230" r="8"/><circle cx="230" cy="170" r="8"/><circle cx="300" cy="150" r="8"/>
    <circle cx="360" cy="190" r="8"/><circle cx="380" cy="250" r="8"/><circle cx="330" cy="300" r="8"/>
    <circle cx="200" cy="290" r="8"/><circle cx="260" cy="310" r="6"/>
  </g>
  <circle cx="260" cy="235" r="16" fill="#ffd166" stroke="#fff" stroke-width="4"/>
  <!-- floating shapes -->
  <g transform="translate(60 330) rotate(-12)">
    <rect width="78" height="78" rx="14" fill="#fff" filter="url(#sh)"/>
    <path d="M39 18L62 58H16z" fill="none" stroke="#6d5dfc" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <g transform="translate(440 150) rotate(10)">
    <rect width="86" height="86" rx="16" fill="#fff" filter="url(#sh)"/>
    <g fill="#b14cf0"><circle cx="25" cy="25" r="7"/><circle cx="61" cy="25" r="7"/><circle cx="25" cy="61" r="7"/></g>
    <text x="61" y="69" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ff8a3d" text-anchor="middle">?</text>
  </g>
  <g transform="translate(420 330)">
    <rect width="120" height="78" rx="18" fill="#1d1640" filter="url(#sh)"/>
    <text x="18" y="32" font-family="Arial, sans-serif" font-size="14" fill="#a99cff">Chỉ số IQ</text>
    <text x="18" y="64" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#ffd166">128</text>
    <path d="M78 58l10-14 8 8 12-18" fill="none" stroke="#3ddc97" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(70 90)">
