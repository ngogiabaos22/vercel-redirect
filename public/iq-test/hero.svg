    <text y="10" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#1d1640" text-anchor="middle">∑</text>
  </g>
  <g fill="none" stroke="#6d5dfc" stroke-width="3" opacity=".5" stroke-dasharray="4 8" stroke-linecap="round">
    <path d="M100 120C140 150 160 170 180 210"/><path d="M440 200C410 210 395 225 385 245"/>
  </g>
